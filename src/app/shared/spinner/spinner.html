@if (loading.loading()) {
      <div class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center
                  align-items-center bg-dark bg-opacity-25"
           style="z-index: 2000;">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    }
